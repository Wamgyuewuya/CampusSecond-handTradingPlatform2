<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/lib/layui/css/layui.css">
    <style>
        body { padding: 20px; background: #f2f2f2; }
        .welcome-card {
            background: #fff;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .welcome-card h2 { font-size: 24px; color: #333; margin-bottom: 12px; }
        .welcome-card p { color: #999; font-size: 14px; }
    </style>
</head>
<body>
<div class="welcome-card">
    <h2>欢迎回来，{{ username }}</h2>
    <p>后台管理功能正在逐步完善中，请使用左侧菜单导航。</p>
</div>
</body>
</html>
